<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotorForm operations</title><link rel="stylesheet" href="/landing.css"></head>
<body><main class="shell finder"><a href="/">← MotorForm</a><h1>Operations</h1>
<form id="access"><label>Operator key<input type="password" id="key" required autocomplete="off"></label><button class="subtle">Load enquiries</button></form>
<p id="status" role="status"></p><div id="queue"></div>
<details><summary>Catalog management</summary><p>Load the current catalog, edit valid configurations and their feature IDs, then publish.</p><button class="subtle" id="load-catalog">Load catalog</button><label>Catalog JSON<textarea id="catalog" rows="12" style="width:100%"></textarea></label><button class="subtle" id="publish">Publish catalog</button></details>
</main><script type="module">
const $ = id => document.getElementById(id);
const changes = {received:['reviewed','closed'],reviewed:['forwarded','closed'],forwarded:['replied','closed'],replied:['closed'],closed:[]};
function message(value) { $('status').textContent=value; }
async function operator(path, method='GET', payload) {
  const response = await fetch('/api/operator/'+path,{method,headers:{Authorization:'Bearer '+$('key').value,'Content-Type':'application/json'},body:payload===undefined?undefined:JSON.stringify(payload)});
  const data=await response.json();
  if (!response.ok) throw new Error(data.error);
  return data;
}
async function refresh() {
  const rows=await operator('enquiries');
  $('queue').replaceChildren();
  for (const row of rows) {
    const card=document.createElement('article');
    card.className='card';
    const title=document.createElement('strong');
    title.textContent=row.title;
    const details=document.createElement('p');
    details.textContent=[row.purpose,row.status,row.email,new Date(row.created_at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}),JSON.parse(row.upgrades).join(', ')].filter(Boolean).join(' · ');
    card.append(title,details);
    for (const status of changes[row.status]) {
      const button=document.createElement('button');
      button.className='subtle';
      button.textContent='Mark '+status;
      button.addEventListener('click',async()=>{
        button.disabled=true;
        try { await operator('enquiries','PATCH',{id:row.id,from:row.status,status}); await refresh(); }
        catch(error) { message(error.message); button.disabled=false; }
      });
      card.append(button);
    }
    $('queue').append(card);
  }
  message(rows.length+' enquiries');
}
$('access').addEventListener('submit',async event=>{
  event.preventDefault();
  $('queue').replaceChildren();
  try { await refresh(); } catch(error) { message(error.message); }
});
$('load-catalog').addEventListener('click',async()=>{
  try {
    const response=await fetch('/api/catalog');
    if (!response.ok) throw new Error('Catalog unavailable.');
    $('catalog').value=JSON.stringify(await response.json(),null,2);
  } catch(error) { message(error.message); }
});
$('publish').addEventListener('click',async()=>{
  try { await operator('catalog','PUT',JSON.parse($('catalog').value)); message('Catalog published.'); }
  catch(error) { message(error.message); }
});
</script></body></html>
